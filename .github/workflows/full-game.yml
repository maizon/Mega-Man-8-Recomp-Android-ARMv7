name: Mega Man 8 Recomp — Full Game Universal ARMv7 + ARM64

on:
  push:
    branches:
      - feature/mali-supreme-armv7
  pull_request:
    branches:
      - feature/mali-supreme-armv7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mm8-full-game-universal
  cancel-in-progress: true

env:
  ANDROID_API: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_CMAKE_VERSION: '3.22.1'
  SDL_VERSION: '3.4.10'
  SDL_COMMIT: '8e37db5e797b6167f3a00d697d816a684bd259c7'

jobs:
  full-game:
    name: Generate game code and build full universal ARMv7 + ARM64 APK
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Require private target repository
        shell: bash
        run: |
          set -euo pipefail
          private="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${GITHUB_REPOSITORY} | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("private", False)).lower())')"
          if [[ "$private" != "true" ]]; then
            echo "::error::This workflow produces a game-derived APK. Keep this repository private so the artifact is not publicly accessible."
            exit 1
          fi
          echo "Privacy gate passed."

      - name: Checkout port source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Vulkan shader compiler and headers
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev
          command -v glslc
          test -s /usr/include/vulkan/vulkan.h

      - name: Set up Android SDK
        uses: android-actions/setup-android@7731365548f3f81c15d4c49c8f1d29101e02cdcf # v4.0.2
        with:
          packages: platform-tools

      - name: Install pinned Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          test -x "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          test -x "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -x "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: '8.9'

      - name: Resolve and download public BIN/CUE assets from release tag
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          DISC_DIR="${RUNNER_TEMP}/mm8-disc"
          mkdir -p "${DISC_DIR}"
          RELEASE_JSON="${RUNNER_TEMP}/mm8-release.json"
          # The release is public; do not use a possibly stale token that can cause 404.
          STATUS="$(curl --silent --show-error --location \
            --output "${RELEASE_JSON}" --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/maizon/mm8-game-data/releases/tags/Rom")"
          if [[ "${STATUS}" != "200" ]]; then
            echo "::error::Could not read public release tag Rom from maizon/mm8-game-data (HTTP ${STATUS}); verify the release tag and GitHub availability."
            exit 1
          fi

          python3 - "${RELEASE_JSON}" "${RUNNER_TEMP}/mm8-assets.env" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              release = json.load(f)
          assets = [a for a in release.get("assets", []) if a.get("state") == "uploaded"]
          def select(ext):
              found = [a for a in assets if a.get("name", "").lower().endswith(ext)]
              if len(found) != 1:
                  names = ", ".join(a.get("name", "<unnamed>") for a in assets)
                  raise SystemExit(f"Expected exactly one {ext} asset in release tag Rom; found {len(found)}. Available assets: {names}")
              return found[0]
          bin_asset, cue_asset = select(".bin"), select(".cue")
          with open(sys.argv[2], "w", encoding="utf-8") as f:
              f.write(f"BIN_URL={bin_asset['browser_download_url']}\n")
              f.write(f"CUE_URL={cue_asset['browser_download_url']}\n")
              f.write(f"BIN_NAME={bin_asset['name']}\n")
              f.write(f"CUE_NAME={cue_asset['name']}\n")
              f.write(f"BIN_SIZE={bin_asset['size']}\n")
              f.write(f"CUE_SIZE={cue_asset['size']}\n")
          print(f"Resolved release assets: {bin_asset['name']} ({bin_asset['size']} bytes), {cue_asset['name']} ({cue_asset['size']} bytes)")
          PY
          source "${RUNNER_TEMP}/mm8-assets.env"

          download_asset() {
            local asset_url="$1" output="$2" label="$3"
            local status
            status="$(curl --silent --show-error --location \
              --output "$output" --write-out '%{http_code}' \
              "$asset_url")"
            if [[ "$status" != "200" ]]; then
              echo "::error::Download of public ${label} asset failed (HTTP ${status}); check the release asset URL/state."
              exit 1
            fi
          }
          # Keep the original BIN basename referenced inside the CUE file.
          BIN_FILE="Mega Man 8 (PT-BR)[Dublado e Legendado].bin"
          download_asset "${BIN_URL}" "${DISC_DIR}/${BIN_FILE}" BIN
          download_asset "${CUE_URL}" "${DISC_DIR}/Mega.Man.8.cue" CUE

          test "$(stat -c %s "${DISC_DIR}/${BIN_FILE}")" = "424493664"
          test "$(stat -c %s "${DISC_DIR}/Mega.Man.8.cue")" = "233"
          echo "86a68a2782208f820cf217e89b3cdd8cf8ec688af7060ebc4eef9ef106c04728  ${DISC_DIR}/${BIN_FILE}" | sha256sum --check
          echo "b9e83bd1e8d1c0dcc5bccd69e64dffc2d0c41cac2f60b452ed0c9b651bba1932  ${DISC_DIR}/Mega.Man.8.cue" | sha256sum --check
          echo "Disc assets downloaded and verified against the expected sizes and SHA-256 digests."

      - name: Fetch SDL3 at the pinned release commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "release-${SDL_VERSION}" https://github.com/libsdl-org/SDL.git third_party/SDL
          actual="$(git -C third_party/SDL rev-parse HEAD)"
          if [[ "$actual" != "${SDL_COMMIT}" ]]; then
            echo "SDL commit mismatch: expected ${SDL_COMMIT}, got $actual" >&2
            exit 1
          fi

      - name: Generate game C code, compile and validate complete APK
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-full-android.sh "${RUNNER_TEMP}/mm8-disc/Mega.Man.8.cue"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "$APK"
          unzip -Z1 "$APK" > "${RUNNER_TEMP}/mm8-apk-files.txt"
          grep -Fxq 'lib/armeabi-v7a/libmain.so' "${RUNNER_TEMP}/mm8-apk-files.txt"
          grep -Fxq 'lib/arm64-v8a/libmain.so' "${RUNNER_TEMP}/mm8-apk-files.txt"
          grep -Fxq 'lib/armeabi-v7a/libc++_shared.so' "${RUNNER_TEMP}/mm8-apk-files.txt"
          grep -Fxq 'lib/arm64-v8a/libc++_shared.so' "${RUNNER_TEMP}/mm8-apk-files.txt"
          if grep -Eq '^lib/(x86|x86_64|riscv64)/' "${RUNNER_TEMP}/mm8-apk-files.txt"; then
            echo "Unexpected non-ARM native ABI in APK." >&2
            exit 1
          fi
          sha256sum "$APK" | tee "${RUNNER_TEMP}/mm8-full-apk.sha256"
          {
            echo "Build result: PASS — full-game APK compiled and package validated."
            echo "This CI build validates packaging and ARMv7 and ARM64 ABIs; physical-device play testing is still required."
            echo "Game-data release: maizon/mm8-game-data, tag Rom"
            echo "SDL commit: $(git -C third_party/SDL rev-parse HEAD)"
            echo "Game source commit: $(git -C third_party/Mega-Man-8-Recomp rev-parse HEAD)"
            echo "PSXRecomp framework commit: $(git -C third_party/Mega-Man-8-Recomp/psxrecomp rev-parse HEAD)"
            echo "APK SHA-256:"
            sha256sum "$APK"
          } > "${RUNNER_TEMP}/mm8-full-build-report.txt"
          cat "${RUNNER_TEMP}/mm8-full-build-report.txt"

      - name: Upload full-game APK and build report (private repository only)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: MegaMan8Recomp-Android-Universal-ARMv7-ARM64-FULL-GAME
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/mm8-full-build-report.txt
          if-no-files-found: error
          retention-days: 3
