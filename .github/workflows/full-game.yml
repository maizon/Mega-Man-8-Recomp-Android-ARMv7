name: Mega Man 8 Recomp — Full Game ARMv7

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mm8-full-game-armv7
  cancel-in-progress: false

env:
  ANDROID_API: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_CMAKE_VERSION: '3.22.1'
  SDL_VERSION: '3.4.10'
  SDL_COMMIT: '8e37db5e797b6167f3a00d697d816a684bd259c7'

jobs:
  full-game:
    name: Generate game code and build full ARMv7 APK
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MM8_GAME_DATA_TOKEN: ${{ secrets.MM8_GAME_DATA_TOKEN }}
    steps:
      - name: Require private target repository and read-only game-data token
        shell: bash
        run: |
          set -euo pipefail
          private="$(curl -fsSL https://api.github.com/repos/${GITHUB_REPOSITORY} | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("private", False)).lower())')"
          if [[ "$private" != "true" ]]; then
            echo "::error::This workflow produces a game-derived APK. Make this repository private before running it, so the artifact is not publicly accessible."
            exit 1
          fi
          if [[ -z "${MM8_GAME_DATA_TOKEN}" ]]; then
            echo "::error::Add repository secret MM8_GAME_DATA_TOKEN with read-only Contents access to maizon/mm8-game-data."
            exit 1
          fi
          echo "Privacy gate passed; credential is present (value not displayed)."

      - name: Checkout port source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@7731365548f3f81c15d4c49c8f1d29101e02cdcf # v4.0.2
        with:
          packages: platform-tools

      - name: Install pinned Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          test -x "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          test -x "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -x "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: '8.9'

      - name: Download private BIN/CUE release assets without logging credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          DISC_DIR="${RUNNER_TEMP}/mm8-disc"
          mkdir -p "${DISC_DIR}"
          trap 'unset MM8_GAME_DATA_TOKEN' EXIT
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${MM8_GAME_DATA_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/maizon/mm8-game-data/releases/assets/650714840" \
            --output "${DISC_DIR}/Mega.Man.8.bin"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${MM8_GAME_DATA_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/maizon/mm8-game-data/releases/assets/650730091" \
            --output "${DISC_DIR}/Mega.Man.8.cue"
          test "$(stat -c %s "${DISC_DIR}/Mega.Man.8.bin")" = "424493664"
          test "$(stat -c %s "${DISC_DIR}/Mega.Man.8.cue")" = "233"
          echo "86a68a2782208f820cf217e89b3cdd8cf8ec688af7060ebc4eef9ef106c04728  ${DISC_DIR}/Mega.Man.8.bin" | sha256sum --check
          echo "b9e83bd1e8d1c0dcc5bccd69e64dffc2d0c41cac2f60b452ed0c9b651bba1932  ${DISC_DIR}/Mega.Man.8.cue" | sha256sum --check
          echo "Disc assets downloaded and verified against the release digests."

      - name: Prepare pinned PSXRecomp framework and runtime patches
        run: bash scripts/prepare-upstream.sh

      - name: Fetch SDL3 at the pinned release commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "release-${SDL_VERSION}" https://github.com/libsdl-org/SDL.git third_party/SDL
          actual="$(git -C third_party/SDL rev-parse HEAD)"
          if [[ "$actual" != "${SDL_COMMIT}" ]]; then
            echo "SDL commit mismatch: expected ${SDL_COMMIT}, got $actual" >&2
            exit 1
          fi

      - name: Generate game C code, compile and validate complete APK
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-full-android.sh "${RUNNER_TEMP}/mm8-disc/Mega.Man.8.cue"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "$APK"
          unzip -Z1 "$APK" > "${RUNNER_TEMP}/mm8-apk-files.txt"
          grep -Fxq 'lib/armeabi-v7a/libmain.so' "${RUNNER_TEMP}/mm8-apk-files.txt"
          if grep -Eq '^lib/(arm64-v8a|x86|x86_64|riscv64)/' "${RUNNER_TEMP}/mm8-apk-files.txt"; then
            echo "Unexpected non-ARMv7 native ABI in APK." >&2
            exit 1
          fi
          sha256sum "$APK" | tee "${RUNNER_TEMP}/mm8-full-apk.sha256"
          {
            echo "Build result: PASS — full-game APK compiled and package validated."
            echo "This CI build validates packaging and ARMv7 ABI; physical-device play testing is still required."
            echo "Game-data release: maizon/mm8-game-data, tag Rom"
            echo "SDL commit: $(git -C third_party/SDL rev-parse HEAD)"
            echo "Game source commit: $(git -C third_party/Mega-Man-8-Recomp rev-parse HEAD)"
            echo "PSXRecomp framework commit: $(git -C third_party/Mega-Man-8-Recomp/psxrecomp rev-parse HEAD)"
            echo "APK SHA-256:"
            sha256sum "$APK"
          } > "${RUNNER_TEMP}/mm8-full-build-report.txt"
          cat "${RUNNER_TEMP}/mm8-full-build-report.txt"

      - name: Upload full-game APK and build report (private repository only)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: MegaMan8Recomp-Android-ARMv7-FULL-GAME
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/mm8-full-build-report.txt
          if-no-files-found: error
          retention-days: 3
