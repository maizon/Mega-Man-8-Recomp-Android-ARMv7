name: Mega Man 8 Recomp — Android shell validation

# Intentionally manual-only. Publishing documentation or making the repository
# public must not start builds or upload artifacts automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mm8-android-shell-manual
  cancel-in-progress: true

jobs:
  notice:
    name: Manual workflow placeholder (no build)
    runs-on: ubuntu-24.04
    steps:
      - name: Explain that builds are intentionally disabled
        run: |
          echo "Automatic compilation is disabled by repository maintainer request."
          echo "This workflow intentionally does not compile or upload APK artifacts."
          echo "Use a separately reviewed, authorized manual build process when needed."
