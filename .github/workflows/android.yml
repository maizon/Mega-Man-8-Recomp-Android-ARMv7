name: Mega Man 8 Recomp — Android ARMv7

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mm8-android-armv7-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_API: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_CMAKE_VERSION: '3.22.1'
  SDL_VERSION: '3.4.10'
  SDL_COMMIT: '8e37db5e797b6167f3a00d697d816a684bd259c7'

jobs:
  android-shell:
    name: Build and validate ARMv7 SHELL APK (no game data)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Validate full-game build driver without game data
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-full-android.sh
          set +e
          output="$(bash scripts/build-full-android.sh 2>&1)"
          status=$?
          set -e
          if [[ "$status" -ne 2 ]]; then
            echo "Expected usage exit code 2 without a disc argument, got $status" >&2
            echo "$output" >&2
            exit 1
          fi
          grep -Fq 'Usage:' <<< "$output"

      - name: Install Vulkan shader compiler and headers
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev
          command -v glslc
          test -s /usr/include/vulkan/vulkan.h

      - name: Set up Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@7731365548f3f81c15d4c49c8f1d29101e02cdcf # v4.0.2
        with:
          packages: platform-tools

      - name: Install pinned Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          test -x "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          test -x "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -x "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: '8.9'

      - name: Prepare pinned public framework assets
        run: bash scripts/prepare-upstream.sh

      - name: Fetch SDL3 at the pinned release commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "release-${SDL_VERSION}" https://github.com/libsdl-org/SDL.git third_party/SDL
          actual="$(git -C third_party/SDL rev-parse HEAD)"
          if [[ "${actual}" != "${SDL_COMMIT}" ]]; then
            echo "SDL commit mismatch: expected ${SDL_COMMIT}, got ${actual}" >&2
            exit 1
          fi
          git -C third_party/SDL status --short
          git -C third_party/SDL log -1 --oneline

      - name: Build shell APK from a clean native build directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/.cxx android/app/build
          gradle -p android --no-daemon --no-build-cache clean assembleDebug --stacktrace

      - name: Validate APK, manifest, signature and ARMv7 ELF
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"
          AAPT="${BUILD_TOOLS}/aapt"
          APK_SIGNER="${BUILD_TOOLS}/apksigner"
          ZIPALIGN="${BUILD_TOOLS}/zipalign"
          REPORT="android/app/build/reports/mm8-armv7-verification.txt"

          test -s "${APK}"
          file "${APK}"
          unzip -t "${APK}"
          "${ZIPALIGN}" -c -v 4 "${APK}"
          "${APK_SIGNER}" verify --verbose --print-certs "${APK}" > /tmp/mm8-apksigner.txt
          cat /tmp/mm8-apksigner.txt
          "${AAPT}" dump badging "${APK}" > /tmp/mm8-badging.txt
          cat /tmp/mm8-badging.txt

          grep -Fq "package: name='com.maizon.megaman8recomp'" /tmp/mm8-badging.txt
          grep -Fq "sdkVersion:'26'" /tmp/mm8-badging.txt
          grep -Fq "targetSdkVersion:'28'" /tmp/mm8-badging.txt
          grep -Fq "launchable-activity: name='com.maizon.megaman8recomp.ShellActivity'" /tmp/mm8-badging.txt

          unzip -Z1 "${APK}" > /tmp/mm8-apk-files.txt
          grep -Fxq 'lib/armeabi-v7a/libmain.so' /tmp/mm8-apk-files.txt
          grep -Fxq 'lib/armeabi-v7a/libc++_shared.so' /tmp/mm8-apk-files.txt
          if grep -Eq '^lib/(arm64-v8a|x86|x86_64|riscv64)/' /tmp/mm8-apk-files.txt; then
            echo "Unexpected native ABI found in ARMv7-only APK" >&2
            exit 1
          fi
          if grep -Fq 'lib/armeabi-v7a/libSDL3.so' /tmp/mm8-apk-files.txt; then
            echo "SDL3 must be statically linked into libmain.so" >&2
            exit 1
          fi

          mkdir -p /tmp/mm8-apk-native
          unzip -jo "${APK}" 'lib/armeabi-v7a/*.so' -d /tmp/mm8-apk-native
          readelf --dyn-syms -W /tmp/mm8-apk-native/libmain.so | grep -E 'FUNC.*GLOBAL.*SDL_main'
          readelf -d /tmp/mm8-apk-native/libmain.so | grep -F 'Shared library: [libc++_shared.so]'
          for lib in /tmp/mm8-apk-native/*.so; do
            echo "Validating ${lib}"
            readelf -h "${lib}" | grep -E 'Class:.*ELF32'
            readelf -h "${lib}" | grep -E 'Machine:.*ARM'
          done

          mkdir -p "$(dirname "${REPORT}")"
          {
            echo "Result: PASS — development shell APK only; not a playable game."
            echo "APK SHA-256:"
            sha256sum "${APK}"
            echo
            echo "Package/minSdk/targetSdk/launcher:"
            grep -E "^(package:|sdkVersion:|targetSdkVersion:|launchable-activity:)" /tmp/mm8-badging.txt
            echo
            echo "Development signing verification:"
            cat /tmp/mm8-apksigner.txt
            echo
            echo "Native entry point:"
            readelf --dyn-syms -W /tmp/mm8-apk-native/libmain.so | grep -E 'FUNC.*GLOBAL.*SDL_main'
            echo
            echo "Native dependencies:"
            readelf -d /tmp/mm8-apk-native/libmain.so | grep 'Shared library'
            echo
            echo "ELF architecture:"
            for lib in /tmp/mm8-apk-native/*.so; do
              echo "${lib}"
              readelf -h "${lib}" | grep -E 'Class:|Machine:'
            done
          } > "${REPORT}"
          cat "${REPORT}"

      - name: Confirm strict mode rejects missing generated game inputs
        shell: bash
        run: |
          set -euo pipefail
          CMAKE="${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake"
          LOG="${RUNNER_TEMP}/mm8-strict-cmake.log"
          if "${CMAKE}" -S android/app/src/main/cpp -B "${RUNNER_TEMP}/mm8-strict-cmake" \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DMM8_REQUIRE_GAME_RUNTIME=ON > "${LOG}" 2>&1; then
            cat "${LOG}"
            echo "ERROR: strict mode unexpectedly configured without generated game/OpenBIOS inputs." >&2
            exit 1
          fi
          grep -F "MM8_REQUIRE_GAME_RUNTIME=ON" "${LOG}"
          grep -F "generated game/OpenBIOS inputs are missing" "${LOG}"
          echo "Strict-mode missing-input guard: PASS" >> android/app/build/reports/mm8-armv7-verification.txt

      - name: Upload validated shell APK and report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: MegaMan8Recomp-Android-ARMv7-SHELL-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/mm8-armv7-verification.txt
          if-no-files-found: error
          retention-days: 14

  android-runtime-smoke:
    name: Compile and link real PSXRecomp runtime for ARMv7 (no game C)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@7731365548f3f81c15d4c49c8f1d29101e02cdcf # v4.0.2
        with:
          packages: platform-tools

      - name: Install pinned Android SDK, NDK, CMake and Ninja
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          python3 -m venv "${RUNNER_TEMP}/ninja-venv"
          "${RUNNER_TEMP}/ninja-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir "ninja==1.11.1.3"
          echo "${RUNNER_TEMP}/ninja-venv/bin" >> "${GITHUB_PATH}"
          CMAKE="${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake"
          "${CMAKE}" --version > "${RUNNER_TEMP}/cmake-version.txt"
          cat "${RUNNER_TEMP}/cmake-version.txt"
          grep -Eq "^cmake version ${ANDROID_CMAKE_VERSION}([[:space:]-]|$)" "${RUNNER_TEMP}/cmake-version.txt"
          "${RUNNER_TEMP}/ninja-venv/bin/python" -m pip show ninja > "${RUNNER_TEMP}/ninja-package.txt"
          grep -Fxq "Version: 1.11.1.3" "${RUNNER_TEMP}/ninja-package.txt"
          ninja --version

      - name: Prepare pinned Android runtime and audited ARMv7 fixes
        run: bash scripts/prepare-upstream.sh

      - name: Fetch SDL3 at the pinned release commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "release-${SDL_VERSION}" https://github.com/libsdl-org/SDL.git third_party/SDL
          actual="$(git -C third_party/SDL rev-parse HEAD)"
          if [[ "${actual}" != "${SDL_COMMIT}" ]]; then
            echo "SDL commit mismatch: expected ${SDL_COMMIT}, got ${actual}" >&2
            exit 1
          fi

      - name: Configure and link PSXRecomp runtime without generated game sources
        shell: bash
        run: |
          set -euo pipefail
          CMAKE="${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake"
          rm -rf build/android-runtime-smoke
          "${CMAKE}" -S tests/android-runtime-smoke -B build/android-runtime-smoke -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$(command -v ninja)" \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPSXRECOMP_ROOT="${GITHUB_WORKSPACE}/third_party/Mega-Man-8-Recomp/psxrecomp" \
            -DSDL_ROOT="${GITHUB_WORKSPACE}/third_party/SDL"
          "${CMAKE}" --build build/android-runtime-smoke --target psx-runtime --parallel 2 --verbose

          mapfile -t libs < <(find build/android-runtime-smoke -type f -name 'libmain.so' -print)
          if [[ "${#libs[@]}" -ne 1 || ! -s "${libs[0]:-}" ]]; then
            echo "Expected exactly one non-empty runtime libmain.so; found ${#libs[@]}" >&2
            exit 1
          fi
          LIB="${libs[0]}"
          readelf -h "${LIB}" | grep -E 'Class:.*ELF32'
          readelf -h "${LIB}" | grep -E 'Machine:.*ARM'
          readelf --dyn-syms -W "${LIB}" | grep -E 'FUNC.*GLOBAL.*SDL_main'
          if readelf -d "${LIB}" | grep -Fq 'libSDL3.so'; then
            echo "Runtime unexpectedly depends on a separate libSDL3.so" >&2
            exit 1
          fi

          mkdir -p artifacts/runtime-smoke
          cp "${LIB}" artifacts/runtime-smoke/libmain.so
          {
            echo "Result: PASS — PSXRecomp runtime compiled and linked for ARMv7 without generated game C."
            echo "This is not a complete game and is not an installable APK."
            echo "Game source pin: $(git -C third_party/Mega-Man-8-Recomp rev-parse HEAD)"
            echo "Framework pin: $(git -C third_party/Mega-Man-8-Recomp/psxrecomp rev-parse HEAD)"
            echo "SDL pin: $(git -C third_party/SDL rev-parse HEAD)"
            echo "CMake version:"
            "${CMAKE}" --version
            echo "Ninja: $(ninja --version)"
            echo
            readelf -h "${LIB}"
            echo
            readelf --dyn-syms -W "${LIB}" | grep -E 'FUNC.*GLOBAL.*SDL_main'
            echo
            readelf -d "${LIB}"
          } > artifacts/runtime-smoke/runtime-smoke-report.txt
          cat artifacts/runtime-smoke/runtime-smoke-report.txt

      - name: Upload runtime smoke library and report (not a game APK)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: MegaMan8Recomp-Android-ARMv7-RUNTIME-SMOKE-NOT-GAME
          path: artifacts/runtime-smoke/*
          if-no-files-found: error
          retention-days: 14
