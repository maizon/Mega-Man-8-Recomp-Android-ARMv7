name: Android ARMv7 APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a native build merely because a documentation/CI commit lands.
# Queued runs are safer while the Android toolchain and source cache are cold.
concurrency:
  group: android-armv7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-armv7:
    name: Build APK (armeabi-v7a)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null

      # Run Gradle setup before fetching SDL: SDL ships an unrelated wrapper JAR.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cache SDL3 source and native build state
        uses: actions/cache@v4
        with:
          path: |
            third_party/SDL
            android/app/.cxx
          key: ${{ runner.os }}-armv7-sdl3-3.4.10-${{ hashFiles('android/app/src/main/cpp/**', 'android/app/build.gradle', 'android/app/src/main/AndroidManifest.xml') }}
          restore-keys: |
            ${{ runner.os }}-armv7-sdl3-3.4.10-

      - name: Fetch SDL3 source if cache missed
        run: |
          if [ ! -f third_party/SDL/CMakeLists.txt ] || ! grep -q 'SDL_VERSION 3.4.10' third_party/SDL/CMakeLists.txt; then
            rm -rf third_party/SDL
            mkdir -p third_party
            git clone --depth 1 --branch release-3.4.10 https://github.com/libsdl-org/SDL.git third_party/SDL
          else
            echo "Using cached SDL3 3.4.10 source"
          fi

      - name: Build debug APK for ARMv7
        run: gradle -p android --no-daemon --build-cache assembleDebug

      - name: Verify APK, SDL entry point and native ABI
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          unzip -l "$APK" | tee /tmp/apk-files.txt
          grep -q 'lib/armeabi-v7a/libmain.so' /tmp/apk-files.txt
          grep -q 'lib/armeabi-v7a/libSDL3.so' /tmp/apk-files.txt
          if grep -Eq 'lib/(arm64-v8a|x86|x86_64)/' /tmp/apk-files.txt; then
            echo "Unexpected non-ARMv7 native ABI found in APK" >&2
            exit 1
          fi
          mkdir -p /tmp/apk-native
          unzip -j "$APK" 'lib/armeabi-v7a/*.so' -d /tmp/apk-native
          echo "Checking exported SDLActivity entry point in libmain.so"
          readelf --dyn-syms -W /tmp/apk-native/libmain.so | grep -E 'FUNC.*GLOBAL.*SDL_main'
          for lib in /tmp/apk-native/*.so; do
            echo "Checking ELF architecture: $lib"
            readelf -h "$lib" | grep -E 'Class:.*ELF32'
            readelf -h "$lib" | grep -E 'Machine:.*ARM'
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MegaMan8Recomp-Android-ARMv7-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
