name: Android ARMv7 APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-armv7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-armv7:
    name: Build APK (armeabi-v7a)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null

      - name: Fetch SDL3 source
        run: |
          mkdir -p third_party
          git clone --depth 1 --branch release-3.2.16 https://github.com/libsdl-org/SDL.git third_party/SDL

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK for ARMv7
        run: gradle -p android --no-daemon assembleDebug

      - name: Verify APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MegaMan8Recomp-Android-ARMv7-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
